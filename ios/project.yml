name: Robin
options:
  bundleIdPrefix: org.evergreenlabs
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    # SENTRY_DSN / APTABASE_* live only in Config.xcconfig (gitignored).
    # Do not set empty defaults here — pbxproj would override the xcconfig.
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.28.0
  aptabase-swift:
    url: https://github.com/aptabase/aptabase-swift
    from: 0.3.4
targets:
  Robin:
    type: application
    platform: iOS
    sources:
      - path: Robin
        excludes:
          - "**/*.md"
          - "Resources/x-filter/**"
      - path: Robin/Resources/x-filter
        type: folder
        buildPhase: resources
        headerVisibility: project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.evergreenlabs.robin
        PRODUCT_NAME: Robin
        MARKETING_VERSION: "0.2.15"
        CURRENT_PROJECT_VERSION: "50"
        INFOPLIST_FILE: Robin/Info.plist
        CODE_SIGN_ENTITLEMENTS: Robin/Robin.entitlements
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: X5J5T5UT6J
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGN_ENTITLEMENTS: Robin/Robin.entitlements
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          CODE_SIGN_ENTITLEMENTS: Robin/RobinRelease.entitlements
    dependencies:
      # Sentry-Dynamic embeds a dSYM in the archive; static `Sentry` triggers
      # App Store "Upload Symbols Failed" for Sentry.framework (Xcode 16+).
      - package: sentry-cocoa
        product: Sentry-Dynamic
      - package: aptabase-swift
        product: Aptabase
    # Keep custom Info.plist keys; do not let empty properties wipe the file.
    info:
      path: Robin/Info.plist
      properties:
        CFBundleDisplayName: Robin
        CFBundleName: Robin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SENTRY_DSN: $(SENTRY_DSN)
        APTABASE_APP_KEY: $(APTABASE_APP_KEY)
        APTABASE_HOST: $(APTABASE_HOST)
        # Standard HTTPS only — answers the App Store Connect export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: org.evergreenlabs.robin.auth
            CFBundleURLSchemes:
              - robin
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
